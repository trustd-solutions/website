<!-- ======= Header ======= -->
<header id="header" class="fixed-top d-flex align-items-center">
  <div class="container d-flex align-items-center justify-content-between">
    <div class="logo">
      <a href="/"
        ><img src="/assets/img/logo.png" alt="TrustD Solutions home" class="img-fluid"
      /></a>
    </div>

    <nav id="navbar" class="navbar">
      <button type="button" class="mobile-nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="nav-links"><i class="bi bi-list" aria-hidden="true"></i></button>
      <ul id="nav-links">
        <li><a {{ if .IsHome }}aria-current="page" class="active"{{ end }} href="/">Home</a></li>
        <li><a {{ if eq .RelPermalink ("services/" | relURL) }}aria-current="page" class="active"{{ end }} href="/services/">Services</a></li>
        <li><a {{ if eq .RelPermalink ("about/" | relURL) }}aria-current="page" class="active"{{ end }} href="/about/">About Us</a></li>
        <li><a {{ if eq .RelPermalink ("portfolio/" | relURL) }}aria-current="page" class="active"{{ end }} href="/portfolio/">Portfolio</a></li>
        <li><a class="getstarted booking-link" href="{{ site.Params.bookingURL }}">Let's Talk!</a></li>
      </ul>
    </nav>
    <!-- .navbar -->
  </div>
</header>
<!-- End Header -->
